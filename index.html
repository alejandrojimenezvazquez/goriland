<!doctype html>
<!--
  GORILAND · histórico de competiciones del grupo
  ------------------------------------------------------------------
  Web de una sola página (sin compilar), dividida en archivos:
  index.html (estructura), style.css (estilos) y la carpeta js/ (lógica).
  Competiciones: Cortijos League (fútbol) y GP Goriland (karts).

  Cómo funciona
  - Los datos viven en Supabase (tablas members y events, como JSON).
  - Cualquiera puede ver la web; solo el administrador (login en la
    pestaña Admin) puede crear, editar o borrar datos.
  - Los escudos y logos se guardan en el bucket «escudos» de Storage.

  Puesta en marcha
  1. Ejecuta supabase.sql, storage.sql y storage_logos.sql en Supabase
     (cambiando TU_EMAIL por el email del administrador).
  2. Comprueba SUPABASE_URL y SUPABASE_ANON_KEY al principio de js/config.js.
  3. Sube index.html, style.css y la carpeta js/ (con todo su contenido)
     a un hosting estático.

  Estructura del código (orden de carga; son scripts clásicos que
  comparten variables globales):
  js/config.js      conexión a Supabase, equipos de F1, textos fijos
  js/state.js       estado de la aplicación y cachés
  js/utils.js       utilidades: HTML seguro, tiempos, fechas, orden
  js/stats.js       cálculo de puntos y rankings (sin HTML)
  js/components.js  logos, tablas, tarjetas y gráfico de vueltas
  js/views.js       pestañas y ventanas de detalle
  js/admin.js       panel de administración (formularios y acciones)
  js/db.js          acceso a Supabase: login, carga, guardado y borrado
  js/main.js        pintado general y arranque
-->
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GORILAND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logogoriland.png">
</head>

<body><!-- Aquí se pinta toda la aplicación (ver render()) -->
  <div id="app"></div>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script defer src="js/config.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/utils.js"></script>
<script defer src="js/stats.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/views.js"></script>
<script defer src="js/admin.js"></script>
<script defer src="js/db.js"></script>
<script defer src="js/main.js"></script>
</body>

</html>
